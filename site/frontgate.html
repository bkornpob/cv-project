<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>find ZADDY — dr. kornpob bhirombhakdi</title>
<style>
  :root {
    --bg: #0b0c10;
    --surface: #111318;
    --text: #e6e6e6;
    --muted: #9aa3af;
    --accent: #c9a227;
    --border: #1f232b;
    --link: #7fb3ff;
    --gold-glow: rgba(201, 162, 39, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(201,162,39,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,39,.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }
  #frontgate {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(11,12,16,.97);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #frontgate.hidden { display: none; }
  .fg-card {
    max-width: 640px;
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 32px;
    box-shadow: 0 0 60px var(--gold-glow);
  }
  .fg-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--accent);
    opacity: .85;
    margin-bottom: 4px;
  }
  .fg-sub {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .rule {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: .5;
    margin: 16px 0;
  }
  .fg-enter {
    margin-top: 20px;
    width: 100%;
    padding: 11px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    opacity: .3;
    pointer-events: none;
    text-transform: uppercase;
  }
  .fg-enter.open { opacity: 1; pointer-events: auto; }
  .fg-enter.open:hover { background: rgba(201,162,39,.08); }

  /* ---------- FIND ZADDY GAME ---------- */
  #findZaddy {
    margin: 18px 0 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,.25);
    padding: 14px;
  }
  .zaddy-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  #zaddyGrid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    margin-bottom: 10px;
  }
  #zaddyGrid .cell {
    aspect-ratio: 1;
    background: rgba(201,162,39,.04);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  #zaddyGrid .cell:hover { border-color: var(--accent); color: var(--text); }
  #zaddyGrid .cell.found {
    background: rgba(201,162,39,.2);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 8px var(--gold-glow);
  }
  #zaddyGrid .cell.miss {
    border-color: #4a2020;
    color: #6a2a2a;
  }
  #zaddyStatus {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  #zaddyStatus.complete { color: var(--accent); }
</style>
</head>
<body>

<div id="frontgate">
  <div class="fg-card">
    <div class="fg-title">MULTIVERSELIB COLLECTIVES</div>
    <div class="fg-sub">dr. kornpob bhirombhakdi — frontgate ritual</div>
    <div class="rule"></div>

    <div class="fg-q">find ZADDY in the grid below to prove you belong here:</div>

    <div id="findZaddy">
      <div class="zaddy-label">// scan the grid — click the letters Z-A-D-D-Y in order</div>
      <div id="zaddyGrid"></div>
      <div id="zaddyStatus">[ ] Z</div>
    </div>

    <button class="fg-enter" id="fgEnter">continue to library →</button>
  </div>
</div>

<script>
  const ZADDY = ['Z','A','D','D','Y'];
  let found = [];

  function buildGrid() {
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const size = 50;
    const container = document.getElementById('zaddyGrid');
    container.innerHTML = '';
    const positions = new Set();
    while (positions.size < 5) {
      positions.add(Math.floor(Math.random() * size));
    }
    const posArr = [...positions];

    for (let i = 0; i < size; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (posArr.includes(i)) {
        const letter = ZADDY[found.length];
        cell.textContent = letter;
        cell.dataset.letter = letter;
        cell.dataset.index = i;
        cell.addEventListener('click', () => pickLetter(cell, letter));
      } else {
        cell.textContent = letters[Math.floor(Math.random() * letters.length)];
        cell.dataset.index = i;
        cell.style.opacity = '.5';
      }
      container.appendChild(cell);
    }
  }

  function pickLetter(cell, letter) {
    const expected = ZADDY[found.length];
    if (letter !== expected) {
      cell.classList.add('miss');
      setTimeout(() => cell.classList.remove('miss'), 400);
      return;
    }
    cell.classList.add('found');
    found.push(letter);
    updateStatus();
    if (found.length === 5) {
      document.getElementById('zaddyStatus').textContent = '[ ✓ ] ZADDY FOUND';
      document.getElementById('zaddyStatus').classList.add('complete');
      document.getElementById('fgEnter').classList.add('open');
    }
  }

  function updateStatus() {
    const s = document.getElementById('zaddyStatus');
    s.textContent = '[' + ZADDY.map((_, i) => i < found.length ? '✓' : ' ').join('') + ']';
  }

  document.getElementById('fgEnter').addEventListener('click', () => {
    document.getElementById('frontgate').style.transition = 'opacity .6s';
    document.getElementById('frontgate').style.opacity = '0';
    setTimeout(() => {
      window.location.href = 'landing-page.html';
    }, 600);
  });

  buildGrid();
</script>
</body>
</html>
